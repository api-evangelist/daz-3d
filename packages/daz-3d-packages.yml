method: searched
source: >-
  https://github.com/daz3d (GitHub REST API, org repos + releases/latest),
  https://registry.npmjs.org/, https://pypi.org/, https://www.daz3d.com/daz-studio-4-5-sdk
note: >-
  Daz 3D publishes NO web-API client libraries, because it publishes no web API. What it
  does publish first-party are APPLICATION SDKs and DCC bridge plug-ins: a free C++
  plug-in SDK for Daz Studio, and open-source Daz-to-<DCC> bridges distributed as tagged
  GitHub releases rather than through any language package registry. Registry lookups for
  daz3d / dazstudio / daz on npm and PyPI return either 404 or unrelated squatted names.
  Because none of these are registry-hosted, `version` and `published` are read from the
  GitHub `releases/latest` tag and its publish date — the same currency evidence, from the
  distribution the provider actually uses.
currency_finding: >-
  The bridge plug-in line has visibly decayed. Only DazToRoblox (2025-03-17) shipped a
  release in the last 18 months. The two highest-traffic bridges — DazToUnity (2023-08-12)
  and DazToUnreal (2023-09-05) — have not cut a release in nearly three years, while Daz
  Studio itself is shipping public builds continuously (see changelog/). Four first-party
  repos (DazTo3dsMax, StudioFbxImporter, DazToO3DE, DazToRuntime) have no tagged release
  at all.
