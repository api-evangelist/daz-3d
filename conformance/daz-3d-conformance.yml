method: searched
source: >-
  https://docs.daz3d.com/public/dson_spec/start, https://www.daz3d.com/privacy-policy,
  live probes of every Daz 3D host (see well-known/daz-3d-well-known.yml)
note: >-
  Recorded as an honest negative pass. Daz 3D publishes no web API, so none of the
  cross-cutting HTTP/API standards apply or are claimed. No `Compliance` pointer is wired
  into apis.yml: probe-security-programs.py found no trust center and no named
  certification (SOC 2 / ISO 27001 / PCI / HIPAA / FedRAMP) anywhere on the Daz surface.
  The one real specification Daz does publish is its own file format, DSON.
standards:
- id: dson
  name: DSON (Daz Scene Object Notation)
  conforms: true
  first_party: true
  version: 0.6.1.0
  evidence: >-
    Daz publishes the DSON file format specification in full at
    https://docs.daz3d.com/public/dson_spec/start — a JSON-based scene/asset format with
    documented data types, file types, asset addressing, coordinate systems, an
    alphabetical object definition index and a metadata/content-type vocabulary. First
    public release supporting it was Daz Studio 4.5.x.
  gap: >-
    No downloadable JSON Schema or other machine-readable definition is linked from the
    specification. The format is JSON, but the spec describing it is human-readable web
    pages only — a parser must be written from prose.
- id: json
  name: JSON
  conforms: true
  evidence: DSON is defined as a JSON-syntax format; the spec states it is "simple to parse due to its JSON syntax".
