aid: daz-3d
name: DAZ 3D
description: 'Daz 3D is a Salt Lake City based 3D content and software company best
  known for Daz Studio, a free figure posing, morphing and rendering application, and
  for the Genesis line of morphable 3D human figures. The company runs a large first-party
  and marketplace store of 3D characters, clothing, props and environments, publishes
  the DSON (Daz Scene Object Notation) JSON-based scene file format, and licenses synthetic
  3D character datasets for AI training through the surface that was formerly the Tafi
  brand. Its developer surface is an application SDK rather than a web API: a free C++
  plug-in SDK, the DAZ Script ECMAScript scripting API documented in the public Daz
  Documentation Center, and open-source Daz-to-Blender / Unity / Unreal / Maya / Cinema
  4D / 3ds Max bridge plug-ins published on GitHub. No public REST, GraphQL or event
  API is published.'
