note: >-
  Daz 3D publishes a genuinely detailed, per-build change log in its public Documentation
  Center — one of the strongest artifacts in this profile. It covers the DESKTOP
  APPLICATION (Daz Studio) and its scripting API, not a web API, because Daz publishes no
  web API. Historic per-version change logs for the 4.x line remain published alongside
  the current 6.x log. Daz describes the published log as a "sanitized" version of the
  internal change log — complete enough to track API additions, but not the full record.
scheme: build-number
scheme_note: >-
  Versions are dotted build numbers of the form <major>.<yy>.<yyyy>.<build>, e.g.
  6.25.2025.23807. There is no semver and no documented compatibility contract attached to
  the number.
